<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的发布 - 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题 -->
  <header class="page-header">
    <span class="header-placeholder"></span>
    <h1>我的发布</h1>
    <span class="header-count">共 <em id="mineCount">0</em> 条</span>
  </header>

  <!-- 用户卡片 -->
  <div class="user-card">
    <div class="user-avatar">👤</div>
    <div class="user-info">
      <div class="user-name">李同学 · 计算机学院</div>
      <div class="user-sub">发布于校园失物招领平台</div>
    </div>
  </div>

  <!-- 数据统计 -->
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-num" id="statAll">0</div>
      <div class="stat-label">全部发布</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statActive">0</div>
      <div class="stat-label">进行中</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statDone">0</div>
      <div class="stat-label">已完成</div>
    </div>
  </div>

  <!-- 说明 -->
  <p class="mine-tip">我发布的信息，可随时修改状态</p>

  <!-- 列表 -->
  <div class="mine-list" id="mineList"></div>

  <!-- 空状态 -->
  <div class="empty-state" id="emptyState" style="display:none;">
    你还没有发布过信息
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="publish.html" class="nav-item">
      <span class="nav-icon">➕</span>
      <span>发布</span>
    </a>
    <a href="mine.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>

  <!-- 修改状态面板 -->
  <div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <h3>修改状态</h3>
    <div class="sheet-options" id="sheetOptions"></div>
    <button class="sheet-cancel" onclick="closeSheet()">取消</button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/mine.js"></script>
</body>
</html>
