<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题 -->
  <header class="app-header">
    <h1>校园失物招领</h1>
    <span class="today-new">今日新增 <em id="todayCount">0</em> 条</span>
  </header>

  <!-- 搜索框（点击跳搜索页） -->
  <div class="search-box" onclick="location.href='search.html'">
    <span class="search-icon">🔍</span>
    <span class="search-placeholder">搜索物品名称，如校园卡、钥匙、水杯等</span>
  </div>

  <!-- 筛选标签 -->
  <div class="filter-tabs" id="filterTabs">
    <button class="tab active" data-type="全部">全部</button>
    <button class="tab" data-type="寻物">寻物</button>
    <button class="tab" data-type="招领">招领</button>
  </div>

    <!-- 物品类别筛选 -->
  <div class="category-tabs" id="categoryTabs">
    <button class="cat-tab active" data-cat="全部">全部</button>
    <button class="cat-tab" data-cat="card">校园卡</button>
    <button class="cat-tab" data-cat="device">电子设备</button>
    <button class="cat-tab" data-cat="key">钥匙</button>
    <button class="cat-tab" data-cat="book">书籍</button>
  </div>

  <!-- 列表头部 -->
  <div class="list-header">
    <span>共 <em id="totalCount">0</em> 条信息</span>
    <span class="sort-text">按发布时间排序</span>
  </div>

  <!-- 卡片列表容器（JS 动态渲染） -->
  <div class="card-list" id="cardList"></div>

  <!-- 空状态 -->
  <div class="empty-state" id="emptyState" style="display:none;">
    暂时没有找到相关信息
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="publish.html" class="nav-item">
      <span class="nav-icon">➕</span>
      <span>发布</span>
    </a>
    <a href="mine.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>

  <!-- 引入脚本 -->
  <script src="js/data.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
