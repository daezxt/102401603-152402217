<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="发布校园失物招领信息。">
  <link rel="icon" href="data:,">
  <title>发布信息 - 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题（编辑模式下由 publish.js 改成「编辑信息」） -->
  <header class="page-header">
    <a href="index.html" class="back-btn" aria-label="返回首页">←</a>
    <h1 id="pageTitle">发布信息</h1>
    <span class="header-placeholder"></span>
  </header>

  <!-- 说明文字 -->
  <p class="publish-tip" id="publishTip">选择发布类型后填写信息，发布后其他同学即可看到。</p>

  <!-- 发布表单 -->
  <form class="publish-form" id="publishForm" novalidate>

    <!-- 发布类型 -->
    <div class="form-group">
      <span class="form-label">发布类型</span>
      <div class="type-switch" id="typeSwitch">
        <button type="button" class="type-btn active" data-type="寻物" aria-pressed="true">
          <span aria-hidden="true">🔍</span> 寻物
        </button>
        <button type="button" class="type-btn" data-type="招领" aria-pressed="false">
          <span aria-hidden="true">🤝</span> 招领
        </button>
      </div>
      <p class="type-hint" id="typeHint">寻物：我丢失了东西，寻求帮助</p>
    </div>

    <!-- 物品名称 -->
    <div class="form-group">
      <label class="form-label" for="itemTitle">
        物品名称 <span class="char-count" id="titleCount">0/30</span>
      </label>
      <input type="text" class="form-input" id="itemTitle" maxlength="30" placeholder="例如：校园卡（2023 级）">
    </div>

    <!-- 物品类别 -->
    <div class="form-group">
      <label class="form-label" for="itemCategory">物品类别</label>
      <select class="form-select" id="itemCategory"></select>
      <p class="type-hint">分类会影响首页的类别筛选和列表图标</p>
    </div>

    <!-- 时间 -->
    <div class="form-group">
      <label class="form-label" for="itemTime">时间</label>
      <input type="datetime-local" class="form-input" id="itemTime">
      <p class="type-hint">丢失或捡到物品的时间</p>
    </div>

    <!-- 地点 -->
    <div class="form-group">
      <label class="form-label" for="itemLocation">
        地点 <span class="char-count" id="locationCount">0/30</span>
      </label>
      <input type="text" class="form-input" id="itemLocation" maxlength="30" placeholder="例如：三号食堂二楼">
    </div>

    <!-- 物品描述 -->
    <div class="form-group">
      <label class="form-label" for="itemDesc">
        物品描述 <span class="char-count" id="descCount">0/200</span>
      </label>
      <textarea class="form-textarea" id="itemDesc" rows="4" maxlength="200"
                placeholder="详细描述物品特征，方便失主/拾主辨认"></textarea>
    </div>

    <!-- 联系方式 -->
    <div class="form-group">
      <label class="form-label" for="itemContact">
        联系方式 <span class="char-count" id="contactCount">0/50</span>
      </label>
      <input type="text" class="form-input" id="itemContact" maxlength="50" placeholder="例如：QQ: 123456 或 微信: xxx">
    </div>

    <!-- 联系方式公开方式 -->
    <div class="form-group">
      <span class="form-label">联系方式公开方式</span>
      <div class="contact-mode">
        <label class="mode-option">
          <input type="radio" name="contactMode" value="public" checked>
          <span>公开联系方式（所有人都能看到）</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="contactMode" value="private">
          <span>仅站内联系（其他人要先发申请，你同意后才可见）</span>
        </label>
      </div>
    </div>

    <!-- 发布按钮 -->
    <button type="submit" class="submit-btn" id="submitBtn">发布</button>
  </form>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span>首页</span>
    </a>
    <a href="messages.html" class="nav-item">
      <span class="nav-icon-wrap">
        <span class="nav-icon" aria-hidden="true">💬</span>
        <span class="nav-badge" id="navBadge" style="display:none;">0</span>
      </span>
      <span>私信</span>
    </a>
    <a href="publish.html" class="nav-item active" aria-current="page">
      <span class="nav-icon" aria-hidden="true">➕</span>
      <span>发布</span>
    </a>
    <a href="mine.html" class="nav-item">
      <span class="nav-icon" aria-hidden="true">👤</span>
      <span>我的</span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
