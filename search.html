<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="搜索校园失物招领信息。">
  <link rel="icon" href="data:,">
  <title>搜索 - 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题 -->
  <header class="page-header">
    <a href="index.html" class="back-btn" aria-label="返回首页">←</a>
    <h1>搜索</h1>
    <span class="header-placeholder"></span>
  </header>

  <!-- 搜索输入框 -->
  <div class="search-input-box">
    <span class="search-icon" aria-hidden="true">🔍</span>
    <label class="sr-only" for="searchInput">搜索物品名称</label>
    <input type="text" id="searchInput" placeholder="输入物品名称、地点，如 校园卡 / 图书馆" autocomplete="off">
  </div>

  <!-- 快捷关键词 -->
  <div class="quick-tags" id="quickTags">
    <button type="button" class="quick-tag" data-kw="校园卡">校园卡</button>
    <button type="button" class="quick-tag" data-kw="钥匙">钥匙</button>
    <button type="button" class="quick-tag" data-kw="水杯">水杯</button>
    <button type="button" class="quick-tag" data-kw="耳机">耳机</button>
    <button type="button" class="quick-tag" data-kw="雨伞">雨伞</button>
  </div>

  <!-- 结果头部 -->
  <div class="list-header">
    <span>找到 <em id="resultCount">0</em> 条相关信息</span>
    <span class="sort-text">按发布时间，新的在前</span>
  </div>

  <!-- 结果列表 -->
  <div class="card-list" id="cardList"></div>

  <!-- 空状态 -->
  <div class="empty-state" id="emptyState" style="display:none;">
    暂时没有找到相关信息
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
